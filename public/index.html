<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Sheets ↔ MySQL Sync Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
          <h1>Sheets ↔ MySQL Sync</h1>
        </div>
        <div class="connection-status" id="connectionStatus">
          <span class="status-dot" id="statusDot"></span>
          <span class="status-text" id="statusText">Connecting...</span>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main">
      <!-- Status Cards -->
      <section class="status-cards">
        <div class="card status-card">
          <div class="card-icon sync-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 4v6h-6"/>
              <path d="M1 20v-6h6"/>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/>
              <path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/>
            </svg>
          </div>
          <div class="card-content">
            <h3>Sync Status</h3>
            <p class="card-value" id="syncStatus">Idle</p>
          </div>
        </div>

        <div class="card status-card">
          <div class="card-icon queue-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <line x1="3" y1="9" x2="21" y2="9"/>
              <line x1="9" y1="21" x2="9" y2="9"/>
            </svg>
          </div>
          <div class="card-content">
            <h3>Pending Changes</h3>
            <p class="card-value" id="pendingChanges">0</p>
          </div>
        </div>

        <div class="card status-card">
          <div class="card-icon conflict-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
              <line x1="12" y1="9" x2="12" y2="13"/>
              <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
          </div>
          <div class="card-content">
            <h3>Conflicts</h3>
            <p class="card-value" id="conflictCount">0</p>
          </div>
        </div>

        <div class="card status-card">
          <div class="card-icon time-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
          </div>
          <div class="card-content">
            <h3>Last Sync</h3>
            <p class="card-value" id="lastSync">Never</p>
          </div>
        </div>
      </section>

      <!-- Actions -->
      <section class="actions-section">
        <h2>Actions</h2>
        <div class="actions">
          <button class="btn btn-primary" id="triggerSyncBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 4v6h-6"/>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
            Trigger Full Sync
          </button>
          <button class="btn btn-secondary" id="refreshStatusBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="1 4 1 10 7 10"/>
              <polyline points="23 20 23 14 17 14"/>
              <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
            </svg>
            Refresh Status
          </button>
        </div>
      </section>

      <!-- Event Log -->
      <section class="log-section">
        <div class="log-header">
          <h2>Event Log</h2>
          <button class="btn btn-ghost" id="clearLogBtn">Clear</button>
        </div>
        <div class="log-container" id="eventLog">
          <div class="log-empty">
            <p>Waiting for events...</p>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>Google Sheets ↔ MySQL 2-Way Sync Platform</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
